#!/usr/sbin/nft -f
# J2 : pare-feu, tout ce qui entre est refuse sauf SSH

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;

    # connexions deja etablies et reponses
    ct state established,related accept
    ct state invalid drop

    # boucle locale
    iif "lo" accept

    # ping (utile pour diagnostiquer)
    icmp type echo-request accept
    icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

    # client DHCP (la VM obtient son IP)
    udp sport 67 udp dport 68 accept

    # SSH
    tcp dport 22 accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
  chain output {
    type filter hook output priority 0; policy accept;
  }
}
